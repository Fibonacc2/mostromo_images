name: mostromo_images
description: "Mostromo Images"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.9.2"

dependencies:
  flutter:
    sdk: flutter

  # --- Workspace Paketleri ---

  # --- Diğer Paketler ---
  cupertino_icons: ^1.0.8
  go_router: ^16.3.0
  cached_network_image: ^3.4.1
  shared_core:
  common_ui:
  mostromo_icons:
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  video_thumbnail:
  provider: ^6.1.1
  file_picker: ^8.0.0 # Controller'ın veri türlerini tanımak için
  window_manager: ^0.5.2
  flutter_launcher_icons:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/app_icon.png" # İkon tasarımın buradaysa
  android: "launcher_icon"
  ios: true
